  <line x1="230" y1="265" x2="288" y2="265" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="259" y="255" text-anchor="middle" font-size="10" fill="#58a6ff">stdio</text>
  <line x1="710" y1="180" x2="768" y2="180" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="710" y1="290" x2="768" y2="290" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="710" y1="385" x2="768" y2="385" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Pipeline -->
  <rect x="30" y="472" width="940" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
  <g font-size="13" text-anchor="middle" fill="#e6edf3" font-weight="600">
    <rect x="60" y="492" width="150" height="32" rx="16" fill="#0d1117" stroke="#bc8cff"/><text x="135" y="513">1 · Discover</text>
    <rect x="290" y="492" width="150" height="32" rx="16" fill="#0d1117" stroke="#388bfd"/><text x="365" y="513">2 · Batch + filter</text>
    <rect x="520" y="492" width="150" height="32" rx="16" fill="#0d1117" stroke="#f0883e"/><text x="595" y="513">3 · Audit</text>
    <rect x="750" y="492" width="200" height="32" rx="16" fill="#0d1117" stroke="#3fb950"/><text x="850" y="513">4 · Score + rank</text>
