  <rect x="790" y="340" width="160" height="88" rx="8" fill="#21262d" stroke="#f0883e"/>
  <text x="870" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">GoPlus Security</text>
  <text x="870" y="386" text-anchor="middle" font-size="11" fill="#8b949e">ETH · Base · BSC</text>
  <text x="870" y="402" text-anchor="middle" font-size="11" fill="#8b949e">Arbitrum · Polygon</text>
  <text x="870" y="418" text-anchor="middle" font-size="11" fill="#8b949e">honeypot · taxes</text>

