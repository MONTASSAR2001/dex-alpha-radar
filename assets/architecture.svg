<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">dex-alpha-radar architecture</title>
  <desc id="d">AI agents connect over stdio MCP to the dex-alpha-radar server, which queries DexScreener, RugCheck and GoPlus Security.</desc>
  <defs>
