    <rect x="50" y="122" width="160" height="38" rx="8" fill="#21262d" stroke="#388bfd"/><text x="130" y="146">Claude Code</text>
    <rect x="50" y="172" width="160" height="38" rx="8" fill="#21262d" stroke="#388bfd"/><text x="130" y="196">Antigravity</text>
    <rect x="50" y="222" width="160" height="38" rx="8" fill="#21262d" stroke="#388bfd"/><text x="130" y="246">Cursor</text>
    <rect x="50" y="272" width="160" height="38" rx="8" fill="#21262d" stroke="#388bfd"/><text x="130" y="296">Windsurf / Devin Local</text>
    <rect x="50" y="322" width="160" height="38" rx="8" fill="#21262d" stroke="#388bfd"/><text x="130" y="346">Gemini CLI</text>
    <rect x="50" y="372" width="160" height="38" rx="8" fill="#21262d" stroke="#388bfd"/><text x="130" y="396">npx skills add</text>
